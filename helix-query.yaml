version: 1

indices:
  pages:
    include:
      - '/**'
    exclude:
      - '/**.json'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      published:
        select: head > meta[name="publishdate"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="categorytitle"]
        value: attribute(el, "content")
      categoryUrl:
        select: head > meta[name="categoryurl"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")

  press-releases:
    include:
      - '/us/en/newsroom/press-releases/**'
    exclude:
      - '/**.json'
    target: /us/en/newsroom/press-releases/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      published:
        select: head > meta[name="publishdate"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="categorytitle"]
        value: attribute(el, "content")
      categoryUrl:
        select: head > meta[name="categoryurl"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")